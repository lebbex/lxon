<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Certified Tools | LXON</title>
	<link rel="icon" href="logo.png" type="image/x-icon">
	<link rel="stylesheet" href="https://unpkg.com/lenis@1.3.23/dist/lenis.css">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400&display=swap">
	<link rel="stylesheet" href="/ressources/styles.css">
	<link rel="stylesheet" href="style-home.css">
	<style>
		.cert-title {
			display: block;
			box-sizing: border-box;
			width: max-content;
			max-width: 100%;
			margin: 0 auto;
			padding: 0 20px;
			text-align: center;
			font-size: 200%;
			font-weight: lighter;
			letter-spacing: normal;
			white-space: normal;
		}

		.cert-subtitle {
			display: block;
			box-sizing: border-box;
			width: max-content;
			max-width: min(560px, 100%);
			margin: 18px auto 0 auto;
			padding: 0 20px;
			text-align: center;
			font-size: 90%;
			font-weight: lighter;
			line-height: 1.6;
			opacity: 0.5;
		}

		.cert-subtitle a {
			color: inherit;
		}

		@media (max-width: 700px) {
			.cert-title {
				font-size: 150%;
			}
		}
	</style>
</head>

<body>

	<canvas id="noise-canvas"></canvas>

	<a href="/" class="site-icon site-home">
		<img src="/ressources/home.png" alt="Home">
	</a>

	<div id="scroll-container">
		<main>
			<section class="landing">
				<div class="cert-title">No tools have been certified to date.</div>
				<p class="cert-subtitle">
					If you wish to get your tool officially certified by us,
					or potentially even officialized altogether,
					contact us at <a href="mailto:lxon@lebbex.com">lxon@lebbex.com</a>
				</p>
			</section>

			<div class="divider"></div>

			<footer>
				©Lebbex 2026. All rights reserved.
			</footer>
		</main>
	</div>

	<script src="https://unpkg.com/lenis@1.3.23/dist/lenis.min.js"></script>
	<script src="/ressources/fog.js"></script>
	<script>
		const lenis = new Lenis({
			lerp: 0.1,
			wheelMultiplier: 0.5,
		});

		function docuRaf(time) {
			lenis.raf(time);
			requestAnimationFrame(docuRaf);
		}
		requestAnimationFrame(docuRaf);

		fog.init([0.0, 0.0, 0.0], [0.45, 0.5, 0.65], lenis, document.scrollingElement, 0.02, 2, 0.08, -1);

		const scrollContainer = document.getElementById('scroll-container');

		requestAnimationFrame(() => {
			requestAnimationFrame(() => {
				scrollContainer.classList.add('loaded');
			});
		});
	</script>

</body>

</html>
