<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>LXON Certified Tools</title>
	<link rel="icon" href="logo.png" type="image/x-icon">
	<link rel="stylesheet" href="https://unpkg.com/lenis@1.3.23/dist/lenis.css">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400&display=swap">
	<link rel="stylesheet" href="/ressources/styles.css">
	<style>
		.cert-page {
			display: flex;
			flex-direction: column;
			min-height: 100dvh;
			box-sizing: border-box;
			padding: 0 24px;
			opacity: 0;
			transition: opacity 1s ease;
		}

		.cert-page.loaded {
			opacity: 1;
		}

		.cert-center {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			gap: 18px;
		}

		.cert-title {
			margin: 0;
			font-size: 200%;
			font-weight: lighter;
		}

		.cert-subtitle {
			margin: 0;
			max-width: 560px;
			font-size: 90%;
			font-weight: lighter;
			line-height: 1.6;
			opacity: 0.5;
		}

		.cert-subtitle a {
			color: inherit;
		}

		.cert-footer {
			padding: 20px 0;
			text-align: center;
			font-size: 0.85rem;
			opacity: 0.2;
			-webkit-user-select: none;
			-ms-user-select: none;
			user-select: none;
		}

		@media (max-width: 700px) {
			.cert-title {
				font-size: 150%;
			}
		}
	</style>
</head>

<body>

	<canvas id="noise-canvas"></canvas>

	<a href="/" class="site-icon site-home">
		<img src="/ressources/home.png" alt="Home">
	</a>

	<div class="cert-page" id="cert-page">
		<div class="cert-center">
			<h1 class="cert-title">No tools have been certified to date.</h1>
			<p class="cert-subtitle">
				If you wish to get your tool officially certified by us,
				or potentially even officialized altogether,
				contact us at <a href="mailto:lxon@lebbex.com">lxon@lebbex.com</a>
			</p>
		</div>

		<footer class="cert-footer">
			©Lebbex 2026. All rights reserved.
		</footer>
	</div>

	<script src="https://unpkg.com/lenis@1.3.23/dist/lenis.min.js"></script>
	<script src="/ressources/fog.js"></script>
	<script>
		const lenis = new Lenis({
			lerp: 0.1,
			wheelMultiplier: 0.5,
		});

		function raf(time) {
			lenis.raf(time);
			requestAnimationFrame(raf);
		}
		requestAnimationFrame(raf);

		fog.init([0.0, 0.0, 0.0], [0.45, 0.5, 0.65], lenis, document.scrollingElement, 0.02, 2, 0.08, -1);

		requestAnimationFrame(() => {
			requestAnimationFrame(() => {
				document.getElementById('cert-page').classList.add('loaded');
			});
		});
	</script>

</body>

</html>
